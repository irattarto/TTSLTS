name: Probe Piper voices

on:
  pull_request:
    paths:
      - "tools/probe_piper.py"
      - "src/ttslts/tts/piper_engine.py"
      - ".github/workflows/probe-piper.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . huggingface_hub
      - run: python tools/probe_piper.py
      - uses: actions/upload-artifact@v4
        with:
          name: piper-hungarian-samples
          path: /tmp/*.wav
