name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "android/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a pre-release with this tag (for example v0.1.0), creating the tag on the selected branch. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Tag name without the leading "v"; builds that are not tag pushes get 0.0.0.
  VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.0.0' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - name: Render icons
        run: python packaging/make_icons.py icons
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name TTSLTS --paths src
          --icon icons\ttslts.ico
          --collect-all kokoro_onnx --collect-all espeakng_loader --collect-all phonemizer
          --collect-all language_tags --collect-all csvw --collect-binaries onnxruntime
          --collect-data sounddevice --collect-all _sounddevice_data
          --add-data "src\ttslts;pysrc\ttslts"
          packaging/launcher.py
      - name: Smoke test
        run: |
          if (-not (Test-Path dist\TTSLTS\_internal\pysrc\ttslts\train\run.py)) { throw "training sources missing from the bundle" }
          dist\TTSLTS\TTSLTS.exe --version
          dist\TTSLTS\TTSLTS.exe --selftest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Portable zip
        run: Compress-Archive -Path dist\TTSLTS -DestinationPath TTSLTS-windows.zip
        shell: pwsh
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = $env:VERSION.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$PWD\dist\TTSLTS" `
            "/DIconFile=$PWD\icons\ttslts.ico" `
            "/DOutputDir=$PWD" `
            packaging\windows\ttslts.iss
          if (-not (Test-Path TTSLTS-Setup.exe)) { throw "TTSLTS-Setup.exe was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: TTSLTS-windows
          path: |
            TTSLTS-Setup.exe
            TTSLTS-windows.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt and PortAudio system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - run: pip install -e . pyinstaller
      - name: Render icons
        run: python packaging/make_icons.py icons
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name TTSLTS --paths src
          --collect-all kokoro_onnx --collect-all espeakng_loader --collect-all phonemizer
          --collect-all language_tags --collect-all csvw --collect-binaries onnxruntime
          --collect-data sounddevice --collect-all _sounddevice_data
          --add-data "src/ttslts:pysrc/ttslts"
          packaging/launcher.py
      - name: Smoke test the bundle
        run: |
          test -f dist/TTSLTS/_internal/pysrc/ttslts/train/run.py
          ./dist/TTSLTS/TTSLTS --version
          ./dist/TTSLTS/TTSLTS --selftest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Tarball
        run: tar -C dist -czf TTSLTS-linux-x86_64.tar.gz TTSLTS
      - name: Debian package
        run: |
          version="${VERSION#v}"
          ./packaging/linux/build-deb.sh dist/TTSLTS icons/ttslts.png "$version" "ttslts_${version}_amd64.deb"
      - name: Install the package and run it
        timeout-minutes: 10
        run: |
          set -x
          sudo -E timeout 300 apt-get install -y --no-install-recommends ./ttslts_*_amd64.deb
          test -f /usr/share/applications/ttslts.desktop
          # Full path: the pip-installed console script of the same name is earlier on PATH.
          timeout 60 /usr/bin/ttslts --version
          timeout 120 /usr/bin/ttslts --selftest
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: TTSLTS-linux
          path: |
            TTSLTS-linux-x86_64.tar.gz
            ttslts_*_amd64.deb

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch sherpa-onnx native libraries
        run: ./android/fetch-native.sh
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TTSLTS-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TTSLTS-android
          path: TTSLTS-android.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -lh assets
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            assets/TTSLTS-Setup.exe
            assets/TTSLTS-windows.zip
            assets/ttslts_*_amd64.deb
            assets/TTSLTS-linux-x86_64.tar.gz
            assets/TTSLTS-android.apk
