[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttslts"
version = "0.1.0"
description = "Offline system tray app: Hungarian text to speech (Piper) and RVC v2 real-time voice changing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "phonemizer>=3.4",
    "espeakng-loader>=0.2.4",
]

[project.optional-dependencies]
# For NVIDIA GPUs: install this extra, then `pip uninstall onnxruntime` so the
# CUDA build is the one that gets imported (see README).
gpu = ["onnxruntime-gpu>=1.17"]
# For any GPU on Windows (NVIDIA, AMD, Intel) through DirectML; also `pip uninstall onnxruntime`.
directml = ["onnxruntime-directml>=1.17"]
# Train your own voice (Train tab). Install a CUDA build of PyTorch first for GPU training:
#   pip install torch --index-url https://download.pytorch.org/whl/cu126
train = ["torch>=2.1", "soundfile>=0.12"]
dev = ["pytest>=8", "ruff>=0.5", "soundfile>=0.12"]

[project.gui-scripts]
ttslts = "ttslts.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Original RVC network code, kept as published (see its LICENSE)
extend-exclude = ["src/ttslts/train/rvc_model"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
